name: Daily Activity

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  activity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Keep the contribution graph active
        env:
          ACTIVITY_TOKEN: ${{ secrets.ACTIVITY_TOKEN }}
        run: |
          if [ -z "$ACTIVITY_TOKEN" ]; then
            echo "::notice::Daily contributions are disabled because the ACTIVITY_TOKEN secret is not set."
            echo "To enable automatic daily commits that count toward your contribution graph:"
            echo "  1) Create a PAT at https://github.com/settings/tokens with the 'repo' scope."
            echo "  2) In this repo, go to Settings > Secrets and variables > Actions."
            echo "  3) Add a repository secret named ACTIVITY_TOKEN with the PAT as its value."
            echo "  4) Re-run this workflow (Actions > Daily Activity > Run workflow)."
            exit 0
          fi
          git config user.name "Shashwat Gupta"
          git config user.email "shashwatguptaid@gmail.com"
          git commit --allow-empty -m "chore: keep activity going"
          git push "https://x-access-token:${ACTIVITY_TOKEN}@github.com/LionStone-1/LionStone-1.git" main